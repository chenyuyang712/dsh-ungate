name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --allow-build=esbuild

      - name: Docs consistency
        run: pnpm run check:docs

      - name: Panel bundle matches source
        run: pnpm run check:client

      - name: Panel UI contracts
        run: pnpm run test:ui

      - name: Test
        run: pnpm test

      - name: Packed tarball contents
        run: |
          pnpm pack --pack-destination dist
          node -e '
            const { execFileSync } = require("node:child_process");
            const fs = require("node:fs");
            const tgz = fs.readdirSync("dist").find((f) => f.endsWith(".tgz"));
            const list = execFileSync("tar", ["-tzf", `dist/${tgz}`], { encoding: "utf8" });
            const forbidden = ["package/AGENTS.md", "package/docs/maintainer/", "package/market/", "package/test/"];
            for (const bad of forbidden) {
              if (list.includes(bad)) {
                console.error(`${bad} 不应进发行包`);
                process.exit(1);
              }
            }
            for (const need of ["package/cordis.patch.yml", "package/lib/index.js", "package/client.js", "package/README.md", "package/docs/CLI.md"]) {
              if (!list.includes(need)) {
                console.error(`发行包缺少 ${need}`);
                process.exit(1);
              }
            }
            console.log(`tarball ok: ${tgz} (${list.split("\n").length - 1} files)`);
          '
