<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ig-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1220"/>
      <stop offset="60%" stop-color="#141a30"/>
      <stop offset="100%" stop-color="#1c1440"/>
    </linearGradient>
    <linearGradient id="ig-lock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b8cff"/>
      <stop offset="55%" stop-color="#6f7bff"/>
      <stop offset="100%" stop-color="#9a5cff"/>
    </linearGradient>
    <linearGradient id="ig-shackle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fd0ff"/>
      <stop offset="100%" stop-color="#5b8cff"/>
    </linearGradient>
    <radialGradient id="ig-glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0%" stop-color="#4d6bfe" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#4d6bfe" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#ig-bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#ig-glow)"/>

  <!-- shackle: left leg seated in the body, right leg swung up and out -->
  <g transform="rotate(-16 176 268)">
    <path d="M176 262 V168 a80 80 0 0 1 160 0 V262"
          fill="none" stroke="url(#ig-shackle)" stroke-width="34" stroke-linecap="round"/>
  </g>

  <!-- lock body -->
  <rect x="128" y="256" width="256" height="184" rx="40" fill="url(#ig-lock)"/>
  <circle cx="256" cy="322" r="26" fill="#0e1220"/>
  <rect x="245" y="336" width="22" height="52" rx="11" fill="#0e1220"/>
</svg>
