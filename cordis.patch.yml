# dsh-purge bundle patch
#
# 本插件只做两件事：解锁类宿主补丁（lib/patches）+ 无限制模式预设（presets/unrestricted）。
# 全部能力都通过 cordis 的官方扩展点与配置覆盖实现，不改宿主源码的第三方包。

- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: ""
    # The runtime checks cwd availability; the config layer must not require it.
    personaSuffix: ""

- insert:
    - id: dsh-purge
      name: 'dsh-purge-minimal'
      inject: [systemPrompt, tools]
      config:
        enabled: true
        excludePresets: []
        autoApplyOnStart: false
        autoUpdateOnStart: false
        autoRevertOnMissing: false
        injectOnce: false
        stripMnemon: true
        verbose: false
        postPrompt: ""
        postPromptOrder: 5100
        autoRetry: true
        retryMax: 3
        autoContinue: false
        continueMax: 3
        continueText: "继续"
        capabilityProtocol: true
        hooksDenyBypass: false

    # 自带 agent 预设：unrestricted（无限制模式）
    - id: dsh-purge-presets
      name: dsh-purge-minimal/presets-plugin
